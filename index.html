<script src="https://unpkg.com/maplibre-gl@^5.8.0/dist/maplibre-gl.js"></script>
<link href="https://unpkg.com/maplibre-gl@^5.8.0/dist/maplibre-gl.css" rel="stylesheet" />
<style>
  #map {
    height: 100vh;
  }
</style>
<div id="map"></div>
<script>
  window.onload = () => {
      const map = new maplibregl.Map({
      container: 'map', // container id
      style: 'https://tiles.openfreemap.org/styles/liberty',
      center: [-118.32292, 34.01066], // starting position [lng, lat]
      zoom: 18 // starting zoom
    });

    map.on('load', () => {
      map.addSource('bike-stress-2', {
        type: 'geojson',
        data: 'http://[::]:2000/bike-stress-2.geojson'
      });
      map.addLayer({
        'id': 'bike-stress-2',
        'type': 'line',
        'source': 'bike-stress-2',
        'layout': {
            'line-join': 'round',
            'line-cap': 'round'
        },
        'paint': {
            'line-color': 'orange',
            'line-width': 8
        }
      });

      map.addSource('bike-stress-3', {
        type: 'geojson',
        data: 'http://[::]:2000/bike-stress-3.geojson'
      });
      map.addLayer({
        'id': 'bike-stress-3',
        'type': 'line',
        'source': 'bike-stress-3',
        'layout': {
            'line-join': 'round',
            'line-cap': 'round'
        },
        'paint': {
            'line-color': 'red',
            'line-width': 8
        }
      });
    });
  }
</script>
